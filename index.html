<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp 2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- ── Header siempre visible ─────────────────────────────────────────────── -->
<header>
  <div class="logo-shield">💬</div>
  <div class="header-title">
    <span>WhatsApp 2</span>
    <span id="users-list">Sin usuarios conectados</span>
  </div>
  <button id="edit-profile-btn" class="header-icon-btn" title="Editar perfil" aria-label="Editar perfil" onclick="abrirPerfil()">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  </button>
  <span id="server-tag"></span>
  <div id="status-dot"></div>
</header>

<div id="offline-banner">⚠ Sin conexión al servidor — reintentando...</div>

<!-- ── Login ──────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <h2>WhatsApp 2</h2>
    <p>Ingresa tu nombre para unirte al chat</p>
    <div class="profile-picker">
      <img id="profile-preview" src="/static/default_pfp.webp" alt="Foto de perfil">
      <button class="profile-btn" type="button" onclick="document.getElementById('profile-input').click()">
        Elegir foto
      </button>
      <input id="profile-input" type="file" accept="image/*" hidden>
    </div>
    <div>
      <label>Tu nombre</label>
      <input id="name-input" type="text" placeholder="Tu nombre..." maxlength="30">
    </div>
    <button class="btn-entrar" onclick="entrar()">Continuar</button>
  </div>
</div>

<!-- ── Chat ───────────────────────────────────────────────────────────────── -->
<div id="chat-screen">
  <div id="messages"></div>
  <div id="input-bar">
    <button class="icon-btn" title="Adjuntar archivo" aria-label="Adjuntar archivo" onclick="document.getElementById('file-input').click()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <input id="file-input" type="file" hidden>
    <button id="voice-btn" class="icon-btn" title="Grabar nota de voz" aria-label="Grabar nota de voz" onclick="toggleGrabacion()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <path d="M12 19v3"/>
      </svg>
    </button>
    <div id="composer">
      <div id="selected-file">
        <span id="selected-file-name"></span>
        <button class="icon-btn" title="Quitar archivo" aria-label="Quitar archivo" onclick="quitarArchivo()" style="width:24px;height:24px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="upload-progress">
        <div id="upload-progress-bar"></div>
        <span id="upload-progress-text">Subiendo...</span>
      </div>
      <input id="msg-input" type="text" placeholder="Escribe un mensaje..." maxlength="500" autocomplete="off">
    </div>
    <button id="send-btn" onclick="enviar()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- ── Modal de perfil ────────────────────────────────────────────────────── -->
<div id="profile-modal" class="modal-backdrop">
  <div class="modal">
    <h3>Editar perfil</h3>
    <div class="profile-picker">
      <img id="profile-edit-preview" src="/static/default_pfp.webp" alt="Foto de perfil">
      <button class="profile-btn" type="button" onclick="document.getElementById('profile-edit-input').click()">
        Cambiar foto
      </button>
      <input id="profile-edit-input" type="file" accept="image/*" hidden>
    </div>
    <div>
      <label>Tu nombre</label>
      <input id="profile-name-input" type="text" maxlength="30">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" type="button" onclick="cerrarPerfil()">Cancelar</button>
      <button class="btn-entrar" type="button" onclick="guardarPerfilEditado()">Guardar</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
