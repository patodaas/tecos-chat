<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp 2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wa-bg:         #111b21;
    --wa-panel:      #202c33;
    --wa-header:     #202c33;
    --wa-input-bg:   #2a3942;
    --wa-bubble-own: #005c4b;
    --wa-bubble-other: #202c33;
    --wa-green:      #00a884;
    --wa-green-d:    #008069;
    --wa-text:       #e9edef;
    --wa-text-dim:   #8696a0;
    --wa-divider:    #2a3942;
    --wa-icon:       #aebac1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--wa-bg);
    color: var(--wa-text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--wa-header);
    padding: 0 16px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .logo-shield {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--wa-green);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
  }

  .header-title {
    display: flex; flex-direction: column; flex: 1;
  }

  .header-title span:first-child {
    font-size: 16px;
    font-weight: 600;
    color: var(--wa-text);
    line-height: 1.2;
  }

  .header-title span:last-child {
    font-size: 12px;
    color: var(--wa-text-dim);
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background 0.4s;
    flex-shrink: 0;
  }
  #status-dot.online  { background: var(--wa-green); }
  #status-dot.offline { background: #f44336; }

  #server-tag {
    font-size: 11px;
    color: var(--wa-text-dim);
    margin-right: 6px;
  }

  /* ── Login ── */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--wa-bg);
  }

  .login-box {
    background: var(--wa-panel);
    border-radius: 12px;
    padding: 40px 36px;
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .login-box h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--wa-text);
    text-align: center;
  }

  .login-box p {
    font-size: 13px;
    color: var(--wa-text-dim);
    text-align: center;
    margin-top: -10px;
  }

  .login-box label {
    font-size: 12px;
    color: var(--wa-text-dim);
    margin-bottom: 6px;
    display: block;
  }

  .login-box input {
    width: 100%;
    background: var(--wa-input-bg);
    border: none;
    border-bottom: 2px solid var(--wa-green);
    border-radius: 4px 4px 0 0;
    padding: 10px 12px;
    color: var(--wa-text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .login-box input:focus {
    border-bottom-color: var(--wa-green);
    background: #323f49;
  }

  .btn-entrar {
    background: var(--wa-green);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }

  .btn-entrar:hover  { background: var(--wa-green-d); transform: translateY(-1px); }
  .btn-entrar:active { transform: translateY(0); }

  /* ── Chat ── */
  #chat-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
    /* fondo punteado estilo WA */
    background-color: var(--wa-bg);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.8'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #374045; border-radius: 3px; }

  /* ── Burbujas ── */
  .msg-wrap {
    display: flex;
    flex-direction: column;
    max-width: 65%;
    animation: fadeIn 0.15s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-wrap.own   { align-self: flex-end;   align-items: flex-end; }
  .msg-wrap.other { align-self: flex-start; align-items: flex-start; }

  .msg-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--wa-green);
    margin-bottom: 2px;
    padding: 0 6px;
  }

  .msg-bubble {
    padding: 7px 12px 8px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    position: relative;
  }

  .msg-wrap.own .msg-bubble {
    background: var(--wa-bubble-own);
    border-top-right-radius: 0;
    color: var(--wa-text);
  }

  .msg-wrap.other .msg-bubble {
    background: var(--wa-bubble-other);
    border-top-left-radius: 0;
    color: var(--wa-text);
  }

  .msg-time {
    font-size: 10px;
    color: var(--wa-text-dim);
    margin-top: 2px;
    padding: 0 6px;
  }

  .msg-system {
    align-self: center;
    font-size: 11.5px;
    color: var(--wa-text-dim);
    background: rgba(17,27,33,0.85);
    border: 1px solid var(--wa-divider);
    padding: 5px 14px;
    border-radius: 8px;
    margin: 8px 0;
  }

  /* ── Input bar ── */
  #input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--wa-header);
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--wa-input-bg);
    border: none;
    border-radius: 24px;
    padding: 10px 18px;
    color: var(--wa-text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    resize: none;
  }

  #msg-input::placeholder { color: var(--wa-text-dim); }

  #send-btn {
    width: 46px; height: 46px;
    background: var(--wa-green);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
  }

  #send-btn:hover  { background: var(--wa-green-d); transform: scale(1.05); }
  #send-btn:active { transform: scale(0.97); }
  #send-btn svg { fill: #fff; }

  /* ── Offline banner ── */
  #offline-banner {
    display: none;
    background: #2a3942;
    color: var(--wa-text-dim);
    text-align: center;
    font-size: 12px;
    padding: 6px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- ── Header siempre visible ─────────────────────────────────────────────── -->
<header>
  <div class="logo-shield">💬</div>
  <div class="header-title">
    <span>WhatsApp 2</span>
    <span>Chat Grupal</span>
  </div>
  <span id="server-tag"></span>
  <div id="status-dot"></div>
</header>

<div id="offline-banner">⚠ Sin conexión al servidor — reintentando...</div>

<!-- ── Login ──────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <h2>WhatsApp 2</h2>
    <p>Ingresa tu nombre para unirte al chat</p>
    <div>
      <label>Tu nombre</label>
      <input id="name-input" type="text" placeholder="Tu nombre..." maxlength="30">
    </div>
    <button class="btn-entrar" onclick="entrar()">Continuar</button>
  </div>
</div>

<!-- ── Chat ───────────────────────────────────────────────────────────────── -->
<div id="chat-screen">
  <div id="messages"></div>
  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="Escribe un mensaje..." maxlength="500" autocomplete="off">
    <button id="send-btn" onclick="enviar()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  let ws = null;
  let miNombre = "";
  let reconnectTimer = null;

  // IPs de los servidores: se leen de ?s1=IP&s2=IP en la URL,
  // si no vienen, se usa el mismo host desde donde se abrió la página.
  function buildServers() {
    const params = new URLSearchParams(window.location.search);
    const host   = window.location.hostname || "192.168.1.3";
    const ip1    = params.get("s1") || host;
    const ip2    = params.get("s2") || host;
    // Ambos apuntan al mismo puerto cuando hay un solo server
    const p1 = params.get("p1") || "9000";
    const p2 = params.get("p2") || "9000";
    return [`ws://${ip1}:${p1}`, `ws://${ip2}:${p2}`];
  }
  const SERVERS = buildServers();
  let servidorActual = null;
  let intentoFallback = false;

  function servidorRandom() {
    return Math.random() < 0.5 ? 0 : 1;
  }

  // ── Entrada al chat ───────────────────────────────────────────────────────

  function entrar() {
    const nombre = document.getElementById("name-input").value.trim();
    if (!nombre) { alert("Ponle tu nombre pls 😄"); return; }
    miNombre = nombre;

    // Elegir servidor al azar
    servidorActual = servidorRandom();
    intentoFallback = false;

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("chat-screen").style.display = "flex";

    conectar();
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────

  function conectar() {
    if (ws) { try { ws.close(); } catch(_) {} }

    const url = SERVERS[servidorActual];
    const num = servidorActual + 1;
    document.getElementById("server-tag").textContent = `Servidor ${num}`;

    ws = new WebSocket(url);

    // Timeout de conexión: si en 2s no conectó, intentar el otro servidor
    const connectionTimeout = setTimeout(() => {
      if (ws.readyState !== WebSocket.OPEN) {
        ws.close();
        intentarFallback();
      }
    }, 2000);

    ws.onopen = () => {
      clearTimeout(connectionTimeout);
      intentoFallback = false;
      setStatus(true);
      document.getElementById("offline-banner").style.display = "none";
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      agregarSistema(`Conectado al Servidor ${num} ✓`);
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === "history") {
        data.messages.forEach(m => renderMensaje(m));
      } else if (data.type === "message") {
        renderMensaje(data);
      }
    };

    ws.onclose = () => {
      clearTimeout(connectionTimeout);
      // Si aún no hemos intentado fallback, probar el otro servidor primero
      if (!intentoFallback) {
        intentarFallback();
      } else {
        // Ambos fallaron, reintentar el original en 3s
        setStatus(false);
        document.getElementById("offline-banner").style.display = "block";
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            intentoFallback = false;
            conectar();
          }, 3000);
        }
      }
    };

    ws.onerror = () => { /* onclose se encarga */ };
  }

  function intentarFallback() {
    intentoFallback = true;
    servidorActual = servidorActual === 0 ? 1 : 0;
    const num = servidorActual + 1;
    agregarSistema(`Intentando Servidor ${num}...`);
    setStatus(false);
    document.getElementById("offline-banner").style.display = "block";
    conectar();
  }

  function setStatus(online) {
    const dot = document.getElementById("status-dot");
    dot.className = online ? "online" : "offline";
  }

  // ── Enviar mensaje ────────────────────────────────────────────────────────

  function enviar() {
    const input = document.getElementById("msg-input");
    const texto = input.value.trim();
    if (!texto || !ws || ws.readyState !== WebSocket.OPEN) return;

    const msg = {
      user: miNombre,
      text: texto,
      time: new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" })
    };

    ws.send(JSON.stringify(msg));
    renderMensaje(msg);   // renderizar propio mensaje localmente
    input.value = "";
    input.focus();
  }

  document.addEventListener("keydown", (e) => {
    const input = document.getElementById("msg-input");
    if (document.activeElement === input && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  });

  // ── Render ────────────────────────────────────────────────────────────────

  function renderMensaje(msg) {
    const container = document.getElementById("messages");
    const esPropio = msg.user === miNombre;

    const wrap = document.createElement("div");
    wrap.className = "msg-wrap " + (esPropio ? "own" : "other");

    if (!esPropio) {
      const name = document.createElement("div");
      name.className = "msg-name";
      name.textContent = msg.user;
      wrap.appendChild(name);
    }

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = msg.text;
    wrap.appendChild(bubble);

    const time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = msg.time || "";
    wrap.appendChild(time);

    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
  }

  function agregarSistema(texto) {
    const container = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg-system";
    div.textContent = texto;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  // Enfocar input al cargar
  document.getElementById("name-input").focus();
  document.getElementById("name-input").addEventListener("keydown", e => {
    if (e.key === "Enter") entrar();
  });
</script>
</body>
</html>
